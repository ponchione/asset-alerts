[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "asset-alerts"
version = "0.1.0"
description = "Personal Discord price alerts for gold, silver, and bitcoin."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.12,<4",
  "discord.py>=2.6,<3",
  "python-dotenv>=1.1,<2",
]

[project.scripts]
asset-alerts = "asset_alerts.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<0.17"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
